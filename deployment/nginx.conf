server {
    listen 80 default_server;
    server_name hotelops.ap.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://hotelops.ap.vn$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name hotelops.ap.vn;
    ssl_certificate /etc/letsencrypt/live/hotelops.ap.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotelops.ap.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != hotelops.ap.vn) { return 444; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 12m;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace caller-supplied forwarding headers; this is the only trusted hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control no-store;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
