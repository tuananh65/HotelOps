name: hotelops
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a private SQL administrator password}
    volumes:
      - sql-data:/var/opt/mssql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    image: ${IMAGE_REGISTRY:?Set registry}/hotelops-api:${IMAGE_TAG:?Set immutable commit SHA}
    build:
      context: .
      dockerfile: src/HotelOps.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      AllowedHosts: hotelops.ap.vn;localhost
      Compact__KnownProxies__0: 172.30.40.2
      Compact__EvidenceDirectory: /app/evidence
      Compact__WorkerEnabled: 'false'
      Compact__AutoEndShiftsEnabled: 'true'
    secrets: [db-connection]
    volumes: [evidence:/app/evidence]
    networks:
      proxy: {ipv4_address: 172.30.40.3}
      database: {}
    security_opt: [no-new-privileges:true]
  frontend:
    image: ${IMAGE_REGISTRY:?Set registry}/hotelops-frontend:${IMAGE_TAG:?Set immutable commit SHA}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports: ['80:80', '443:443']
    volumes:
      - ${TLS_DIRECTORY:?Set certificate directory}:/etc/letsencrypt:ro
      - ${ACME_DIRECTORY:?Set ACME webroot}:/var/www/certbot:ro
    networks:
      proxy: {ipv4_address: 172.30.40.2}
    security_opt: [no-new-privileges:true]
secrets:
  db-connection:
    file: ${DB_CONNECTION_FILE:?Set private connection string file}
volumes:
  sql-data:
  evidence:
networks:
  proxy:
    ipam:
      config: [{subnet: 172.30.40.0/24}]
  database:
    internal: true
